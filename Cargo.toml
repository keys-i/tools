[package]
name = "keys-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Fast, focused terminal tools"
license = "MIT"
repository = "https://github.com/keys-i/tools"
readme = "README.md"

[[bin]]
name = "fetch"
path = "src/bin/fetch.rs"

[[bin]]
name = "games"
path = "src/bin/games.rs"

[[bin]]
name = "lazybox"
path = "src/bin/lazybox.rs"

[[bin]]
name = "science"
path = "src/bin/science.rs"

[[bin]]
name = "screensaver"
path = "src/bin/screensaver.rs"

[[bin]]
name = "apps"
path = "src/bin/apps.rs"

[dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
