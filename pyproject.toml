[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "keys-tools"
description = "Fast, focused native terminal tools"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Keys" }]
keywords = ["astronomy", "cli", "containers", "games", "point-cloud", "slurm", "system-information", "terminal", "vcd", "waveform"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Rust",
  "Topic :: System :: Systems Administration",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/keys-i/tools"
Issues = "https://github.com/keys-i/tools/issues"
Source = "https://github.com/keys-i/tools"

[tool.maturin]
bindings = "bin"
compatibility = "pypi"
include = [{ path = "docs/THIRD_PARTY_LICENSES.md", format = ["sdist", "wheel"] }]
strip = true
