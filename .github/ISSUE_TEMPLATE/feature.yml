name: Feature request
description: Propose a focused change backed by a real use case
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What current workflow is blocked or unnecessarily slow?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest observable change that solves it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives
      description: What built-in command, script, or upstream tool did you try?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include measurements for performance or size claims.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps each command focused and does not silently download or install software.
          required: true
        - label: I will follow the repository Code of Conduct.
          required: true
