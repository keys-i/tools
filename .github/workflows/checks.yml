name: Checks

on:
  pull_request:
  push:
    branches: [forge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: cargo test --locked

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Build distribution wheel
        if: runner.os != 'Linux'
        run: |
          python -m pip install --disable-pip-version-check "maturin==1.14.1"
          maturin build --release --locked --out dist

      - name: Build portable Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.14.1
          rust-toolchain: 1.97.1
          target: x86_64-unknown-linux-gnu
          manylinux: 2014
          args: --release --locked --compatibility pypi --out dist

      - name: Smoke-test wheel in a clean environment
        shell: bash
        run: bash scripts/smoke-wheel.sh dist/*.whl

  style:
    name: Rust / style
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
