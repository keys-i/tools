name: Release
run-name: Release ${{ inputs.tag || github.event.pull_request.head.ref || github.ref_name }}

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    release-${{ github.event_name == 'workflow_dispatch' && 'lifecycle' ||
    (github.event_name == 'pull_request' && github.event.action == 'closed' &&
    github.event.pull_request.merged == true &&
    github.event.pull_request.base.ref == 'forge' &&
    github.event.pull_request.head.repo.full_name == github.repository &&
    'lifecycle') ||
    github.run_id }}
  cancel-in-progress: false
  queue: max # GitHub added queued concurrency after Actionlint 1.7.12.

jobs:
  plan:
    name: Validate semantic release plan
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # Release-plz identifies release PR commits.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Attach pull request commit
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          git switch --create release-workflow
          git branch --set-upstream-to="origin/$BASE_BRANCH"

      - name: Dry-run semantic release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semantic:
    name: Resolve semantic release
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'forge' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create the semantic tag and GitHub release.
      pull-requests: read # Verify that the merged PR is a release PR.
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ steps.release.outputs.releases }}

    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Attach merged commit
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          git switch --create release-workflow
          git branch --set-upstream-to="origin/$BASE_BRANCH"

      - name: Authorize merged release pull request
        id: authorize
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          MERGED: ${{ github.event.pull_request.merged }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/release.sh authorize-release

      - name: Create semantic tag and GitHub release
        if: steps.authorize.outputs.authorized == 'true'
        id: release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  select:
    name: Select release tag
    needs: semantic
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (needs.semantic.result == 'success' && needs.semantic.outputs.created == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select automatic or recovery tag
        id: tag
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          RELEASES: ${{ needs.semantic.outputs.releases }}
        run: bash scripts/release.sh select-tag

  metadata:
    name: Validate release
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ needs.select.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.select.outputs.tag }}
          persist-credentials: false

      - name: Match tag to package version
        id: version
        shell: bash
        env:
          TAG: ${{ needs.select.outputs.tag }}
        run: bash scripts/release.sh validate-metadata

  wheels:
    name: Wheel / ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          args: --release --locked --compatibility pypi --out dist
          manylinux: ${{ matrix.manylinux }}
          maturin-version: v1.14.1
          rust-toolchain: 1.97.1
          target: ${{ matrix.target }}

      - name: Smoke-test wheel in a clean environment
        shell: bash
        run: bash scripts/smoke-wheel.sh dist/*.whl

      - name: Store wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  github:
    name: GitHub release assets
    needs: [metadata, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write # Publish GitHub's signed provenance statement.
      contents: write # Attach artifacts to the GitHub release.
      id-token: write # Sign the provenance statement through OIDC.

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Validate release set and write checksums
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bash scripts/release.sh write-checksums

      - name: Reconcile wheels and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: bash scripts/release.sh reconcile-github

      - name: Attest wheels
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl

  pypi:
    name: PyPI trusted publish
    needs: [metadata, wheels, github]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/keys-tools/${{ needs.metadata.outputs.version }}/
    permissions:
      contents: read
      id-token: write # Exchange a short-lived OIDC token with PyPI.

    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  verify-pypi:
    name: Verify PyPI files
    needs: [metadata, wheels, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Verify published files
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bash scripts/release.sh verify-pypi

  release-pr:
    name: Prepare next semantic release
    needs: [semantic, pypi, verify-pypi]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      needs.semantic.result == 'success' &&
      ((needs.pypi.result == 'success' && needs.verify-pypi.result == 'success') ||
      (needs.pypi.result == 'skipped' && needs.verify-pypi.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Push the generated version/changelog commit.
      pull-requests: write # Create or locate the semantic release PR.

    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Attach merged commit
        shell: bash
        run: |
          git switch --create release-workflow
          git branch --set-upstream-to=origin/forge

      - name: Install Release-plz
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: release-plz@0.3.160

      - name: Open or update release pull request without force-push
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/release.sh prepare-pr
